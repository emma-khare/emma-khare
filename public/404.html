<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found, Emma Khare</title>
    <style>
      :root {
        --cream: #fbf5ef;
        --ink: #3a1c25;
        --garnet: #98203f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        background: linear-gradient(180deg, var(--cream), #f4e9e1);
        color: var(--ink);
        font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.55;
      }
      main { max-width: 30rem; }
      .eyebrow {
        margin: 0 0 1rem;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--garnet);
      }
      h1 {
        margin: 0;
        font-family: "Playfair Display", Georgia, "Times New Roman", serif;
        font-size: clamp(2.25rem, 8vw, 3.25rem);
        font-weight: 500;
        letter-spacing: -0.015em;
        line-height: 1.05;
      }
      p.body { margin: 1rem 0 1.75rem; color: rgba(58, 28, 37, 0.75); }
      a.home {
        display: inline-block;
        padding: 0.65rem 1.25rem;
        border-radius: 999px;
        background: var(--ink);
        color: var(--cream);
        font-size: 0.9rem;
        font-weight: 500;
        text-decoration: none;
      }
      a.home:hover { background: var(--garnet); }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404</p>
      <h1>This page isn't here.</h1>
      <p class="body">
        The link may be old, or the case study may have moved. Everything else is one click away.
      </p>
      <a class="home" href="/">Back to the portfolio</a>
    </main>
  </body>
</html>
